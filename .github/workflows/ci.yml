name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'release/*'
  pull_request:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.34.6

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: 'pnpm'
          registry-url: "https://registry.npmjs.org"

      # Ensure recent npm for trusted publishing (OIDC, npm >= 11.5.1). Pinned, not
      # `@latest`: npm 12 requires node `^22.22.2 || ^24.15.0 || >=26.0.0`, so once it
      # shipped, `npm@latest` started failing EBADENGINE against the node pinned above
      # and took every CI run with it. Keep this version compatible with `node-version`.
      - name: Use pinned npm
        run: npm install -g npm@11.21.0

      - uses: nrwl/nx-set-shas@v5.0.1

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Run lint, test and build
        run: pnpm nx affected -t lint test build

      - name: Print environment info
        run: pnpm nx report
        shell: bash

      # Publish only for a pushed `release/*` tag — the `releaseTagPattern` already
      # configured in nx.json. `nx release publish` is not idempotent: it republishes
      # whatever version package.json holds, so running it on every main push failed
      # with EPUBLISHCONFLICT on every commit that did not bump versions (which is
      # most of them). Cutting a release is now `nx release` + pushing its tag.
      - name: Publish packages
        if: ${{ startsWith(github.ref, 'refs/tags/release/') }}
        run: pnpm nx release publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.NODE_GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true